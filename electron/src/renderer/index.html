<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>BitBoard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <nav id="sidebar">
      <div id="sidebar-top">
        <div class="brand-row">
          <span class="brand-icon">&#9638;</span>
          <span class="brand-label">BitBoard</span>
        </div>
      </div>

      <div id="board-list"></div>

      <div id="sidebar-actions">
        <button id="btn-add-board" class="side-btn" title="New board">
          <span class="btn-icon">+</span>
          <span class="btn-label">New board</span>
        </button>
        <button id="btn-join-board" class="side-btn" title="Join board by name">
          <span class="btn-icon">&#8599;</span>
          <span class="btn-label">Join board</span>
        </button>
        <button id="btn-settings" class="side-btn" title="Settings">
          <span class="btn-icon">&#9881;</span>
          <span class="btn-label">Settings</span>
        </button>
      </div>

      <div id="sidebar-footer">
        <div id="log" class="log-hidden"></div>
      </div>
    </nav>

    <main id="content">
      <header id="content-header">
        <h1 id="board-title">No board selected</h1>
        <div id="board-meta"></div>
        <div id="view-tabs">
          <button id="tab-gallery" class="tab-btn active" title="Image board view">Gallery</button>
          <button id="tab-details" class="tab-btn" title="File list view">Details</button>
        </div>
        <button id="btn-add-image" class="flat-btn" disabled>Add image</button>
      </header>
      <div id="image-list"></div>
      <div id="image-gallery"></div>
    </main>
  </div>

  <div id="lightbox" class="hidden">
    <div id="lightbox-inner">
      <img id="lightbox-img" alt="">
      <div id="lightbox-caption"></div>
    </div>
  </div>

  <div id="modal-backdrop" class="hidden">
    <div id="modal">
      <div id="modal-title">New board</div>
      <input id="modal-input" type="text" spellcheck="false" autocomplete="off">
      <div id="modal-error"></div>
      <div id="modal-buttons">
        <button id="modal-cancel" class="flat-btn">Cancel</button>
        <button id="modal-ok" class="flat-btn">OK</button>
      </div>
    </div>
  </div>

  <div id="settings-backdrop" class="hidden">
    <div id="settings-panel">
      <div id="settings-title">Settings</div>

      <div class="settings-section">Preferences</div>
      <label class="settings-row">
        <input type="checkbox" id="setting-show-log">
        <span>Show activity log in the sidebar</span>
      </label>
      <label class="settings-row">
        <input type="checkbox" id="setting-confirm-leave">
        <span>Ask for confirmation before leaving a board</span>
      </label>

      <div class="settings-section">Blacklisted images (by content hash)</div>
      <div id="blacklist-images" class="blacklist-list"></div>

      <div class="settings-section">Blacklisted boards</div>
      <div id="blacklist-boards" class="blacklist-list"></div>

      <div class="settings-section">Blacklisted peers</div>
      <div id="blacklist-peers" class="blacklist-list"></div>

      <div id="settings-peerid" class="settings-peerid"></div>

      <div id="settings-buttons">
        <button id="settings-close" class="flat-btn">Close</button>
      </div>
    </div>
  </div>

  <div id="icon-picker-backdrop" class="hidden">
    <div id="icon-picker">
      <div id="icon-picker-title">Pick a board icon</div>
      <div id="icon-grid"></div>
      <div id="icon-picker-buttons">
        <button id="icon-clear" class="flat-btn">Clear</button>
        <button id="icon-cancel" class="flat-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
